<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网址导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0b1020;
    --card: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.10);
    --text: #e5e9f0;
    --muted: #8b93a7;
    --accent: #6366f1;
  }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1e1b4b 0%, #0b1020 55%, #070a14 100%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 48px 20px 64px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  .head { text-align: center; margin-bottom: 36px; }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 14px;
    border-radius: 18px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    box-shadow: 0 10px 30px rgba(99,102,241,.35);
  }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  /* 搜索框 */
  .search { position: relative; max-width: 560px; margin: 28px auto 0; }
  .search input {
    width: 100%; padding: 16px 52px 16px 20px;
    font-size: 15px; color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    outline: none;
    transition: all .2s;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(99,102,241,.15); }
  .search input::placeholder { color: #5b6478; }
  .search button {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 16px; cursor: pointer;
    transition: background .2s;
  }
  .search button:hover { background: #7c7ff5; }
  /* 分组 */
  .group { margin-top: 40px; }
  .group h2 {
    font-size: 14px; font-weight: 600; color: var(--muted);
    letter-spacing: 2px; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .group h2::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
  }
  .link {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 16px 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none; color: var(--text);
    transition: all .18s;
  }
  .link:hover {
    background: rgba(99,102,241,.16);
    border-color: rgba(129,140,248,.5);
    transform: translateY(-3px);
  }
  .ico { font-size: 24px; line-height: 1; }
  .name { font-size: 12.5px; color: #c3c9d8; }
  footer {
    text-align: center; margin-top: 56px;
    color: #4a5266; font-size: 12px; line-height: 1.8;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">🧭</div>
    <h1>网址导航</h1>
    <p class="sub">我的常用网站，一键直达</p>
    <div class="search">
      <input id="q" type="text" placeholder="输入关键词，回车用 Google 搜索…" autocomplete="off">
      <button onclick="goSearch()">🔍</button>
    </div>
  </div>

  <div class="group">
    <h2>🚀 常用</h2>
    <div class="grid">
      <a class="link" href="https://www.google.com" target="_blank"><span class="ico">🔍</span><span class="name">Google</span></a>
      <a class="link" href="https://www.youtube.com" target="_blank"><span class="ico">▶️</span><span class="name">YouTube</span></a>
      <a class="link" href="https://github.com" target="_blank"><span class="ico">🐙</span><span class="name">GitHub</span></a>
      <a class="link" href="https://chatgpt.com" target="_blank"><span class="ico">🤖</span><span class="name">ChatGPT</span></a>
      <a class="link" href="https://x.com" target="_blank"><span class="ico">✖️</span><span class="name">X / Twitter</span></a>
      <a class="link" href="https://www.wikipedia.org" target="_blank"><span class="ico">📖</span><span class="name">Wikipedia</span></a>
    </div>
  </div>

  <div class="group">
    <h2>🛠 工具</h2>
    <div class="grid">
      <a class="link" href="https://mail.google.com" target="_blank"><span class="ico">📧</span><span class="name">Gmail</span></a>
      <a class="link" href="https://drive.google.com" target="_blank"><span class="ico">📁</span><span class="name">云端硬盘</span></a>
      <a class="link" href="https://translate.google.com" target="_blank"><span class="ico">🌐</span><span class="name">翻译</span></a>
      <a class="link" href="https://www.deepl.com" target="_blank"><span class="ico">🔤</span><span class="name">DeepL</span></a>
      <a class="link" href="https://stackoverflow.com" target="_blank"><span class="ico">💻</span><span class="name">Stack Overflow</span></a>
      <a class="link" href="https://www.icloud.com" target="_blank"><span class="ico">☁️</span><span class="name">iCloud</span></a>
    </div>
  </div>

  <div class="group">
    <h2>🇨🇳 国内常用</h2>
    <div class="grid">
      <a class="link" href="https://www.baidu.com" target="_blank"><span class="ico">🐾</span><span class="name">百度</span></a>
      <a class="link" href="https://www.zhihu.com" target="_blank"><span class="ico">💡</span><span class="name">知乎</span></a>
      <a class="link" href="https://www.bilibili.com" target="_blank"><span class="ico">📺</span><span class="name">哔哩哔哩</span></a>
      <a class="link" href="https://weibo.com" target="_blank"><span class="ico">🌊</span><span class="name">微博</span></a>
      <a class="link" href="https://www.taobao.com" target="_blank"><span class="ico">🛒</span><span class="name">淘宝</span></a>
      <a class="link" href="https://www.jd.com" target="_blank"><span class="ico">📦</span><span class="name">京东</span></a>
    </div>
  </div>

  <div class="group">
    <h2>📚 学习</h2>
    <div class="grid">
      <a class="link" href="https://www.coursera.org" target="_blank"><span class="ico">🎓</span><span class="name">Coursera</span></a>
      <a class="link" href="https://www.bilibili.com" target="_blank"><span class="ico">🎬</span><span class="name">B站学习</span></a>
      <a class="link" href="https://developer.mozilla.org" target="_blank"><span class="ico">📘</span><span class="name">MDN 文档</span></a>
      <a class="link" href="https://juejin.cn" target="_blank"><span class="ico">⚡</span><span class="name">掘金</span></a>
      <a class="link" href="https://www.runoob.com" target="_blank"><span class="ico">📗</span><span class="name">菜鸟教程</span></a>
      <a class="link" href="https://arxiv.org" target="_blank"><span class="ico">📄</span><span class="name">arXiv</span></a>
    </div>
  </div>

  <footer>
    网址导航 · 由 GitHub Pages 免费托管<br>
    想加新网站？改这个页面的 HTML 即可
  </footer>
</div>
<script>
  const q = document.getElementById('q');
  function goSearch() {
    const v = q.value.trim();
    if (!v) return;
    window.open('https://www.google.com/search?q=' + encodeURIComponent(v), '_blank');
  }
  q.addEventListener('keydown', e => { if (e.key === 'Enter') goSearch(); });
</script>
</body>
</html>
